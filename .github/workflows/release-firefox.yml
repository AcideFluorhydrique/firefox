name: Release Firefox

# 每天檢查 Mozilla 官方 release 分支（正式版 Firefox，約每月一個大版本）的版本號，
# 這個 repo 還沒有對應的 GitHub Release 就編譯所有平台並發一個新的 Release。

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "已經有同版本的 Release 也重新編譯（會覆蓋同名檔案）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-firefox
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      branch: ${{ steps.v.outputs.branch }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release
          FORCE: ${{ inputs.force || false }}
        run: |
          sha=$(git ls-remote https://github.com/mozilla-firefox/firefox "refs/heads/$BRANCH" | cut -f1)
          [ -n "$sha" ] || { echo "找不到上游分支 $BRANCH"; exit 1; }
          version=$(curl -fsSL "https://raw.githubusercontent.com/mozilla-firefox/firefox/$sha/browser/config/version_display.txt" | tr -d '[:space:]')
          [ -n "$version" ] || { echo "讀不到版本號"; exit 1; }
          build=true
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            build=false
          fi
          echo "上游 $BRANCH = $sha，版本 $version，要編譯: $build"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "build=$build"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-linux.yml
    with:
      source_ref: ${{ needs.check.outputs.sha }}

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      source_ref: ${{ needs.check.outputs.sha }}

  macos-arm64:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      source_ref: ${{ needs.check.outputs.sha }}
      runner: macos-latest

  macos-x64:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      source_ref: ${{ needs.check.outputs.sha }}
      runner: macos-15-intel

  fenix-arm64:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-fenix.yml
    with:
      source_ref: ${{ needs.check.outputs.sha }}
      target: aarch64-linux-android

  # 全部平台都成功才發 Release；有任何一個失敗就不發，隔天排程會再試一次
  publish:
    needs: [check, linux, windows, macos-arm64, macos-x64, fenix-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # 只挑使用者要下載的安裝檔，並統一命名；測試用的 xpt_artifacts 和沒有 Gecko 的其他 ABI APK 不放進 Release
      - name: Collect files
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p release
          pick() {
            local src
            src=$(find dist -type f -path "$1" ! -name '*xpt_artifacts*' | head -1)
            [ -n "$src" ] || { echo "找不到 $1"; exit 1; }
            cp "$src" "release/$2"
          }
          pick 'dist/firefox-linux-*/*.tar.*'        "firefox-$VERSION-linux-x86_64.tar.xz"
          pick 'dist/firefox-windows-*/*.win64.zip'  "firefox-$VERSION-windows-x64.zip"
          pick 'dist/firefox-macos-ARM64/*.dmg'      "firefox-$VERSION-macos-arm64.dmg"
          pick 'dist/firefox-macos-X64/*.dmg'        "firefox-$VERSION-macos-x64.dmg"
          pick 'dist/fenix-debug-*/*arm64-v8a*.apk'  "fenix-$VERSION-arm64-v8a-debug.apk"
          ls -lh release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
          BRANCH: ${{ needs.check.outputs.branch }}
        run: |
          tag="v$VERSION"
          notes="從 mozilla-firefox/firefox 的 \`$BRANCH\` 分支編譯（commit $SHA）。

          - Linux / Windows / macOS：未簽名的官方原始碼編譯版
          - Android：Fenix debug 版（包名 org.mozilla.fenix.debug），可以和官方 Firefox 同時安裝"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* -R "$GITHUB_REPOSITORY" \
              --title "Firefox $VERSION" --notes "$notes" --target ci
          fi
