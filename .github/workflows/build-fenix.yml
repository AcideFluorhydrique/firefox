name: Build Fenix APK

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "原始碼 repo（預設直接用 Mozilla 官方）"
        required: true
        default: "mozilla-firefox/firefox"
        type: string
      source_ref:
        description: "分支 / tag / commit"
        required: true
        default: "main"
        type: string
      target:
        description: "CPU 架構"
        required: true
        default: "aarch64-linux-android"
        type: choice
        options:
          - aarch64-linux-android   # 一般手機 (arm64)
          - arm-linux-androideabi   # 舊款 32 位元手機
          - x86_64-linux-android    # 模擬器

  # 讓 release-firefox.yml 可以直接呼叫
  workflow_call:
    inputs:
      source_repo:
        type: string
        default: "mozilla-firefox/firefox"
      source_ref:
        type: string
        default: "main"
      target:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MOZCONFIG: ${{ github.workspace }}/../mozconfig-ci

    steps:
      # 免費 runner 只有約 14GB 可用空間，先清掉用不到的預裝工具
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      # artifact mode 需要往回找有預編譯產物的祖先 commit，所以不能只抓 1 層歷史
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 200

      - name: Get fixed debug keystore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../ci-keys"
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.github/keys/fenix-debug.keystore?ref=${{ github.workflow_sha }}" \
            -o "$GITHUB_WORKSPACE/../ci-keys/fenix-debug.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/../ci-keys/fenix-debug.keystore" -storepass android | grep -i fingerprint

      - name: Cache ~/.mozbuild (toolchains, Android SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ runner.os }}-${{ inputs.target }}-${{ hashFiles('python/mozboot/mozboot/android.py') }}
          restore-keys: |
            mozbuild-${{ runner.os }}-${{ inputs.target }}-

      - name: Write mozconfig
        run: |
          cat > "$MOZCONFIG" <<EOF
          ac_add_options --enable-project=mobile/android
          ac_add_options --target=${{ inputs.target }}
          ac_add_options --enable-artifact-builds
          mk_add_options MOZ_OBJDIR=./objdir-frontend
          EOF
          cat "$MOZCONFIG"

      - name: Bootstrap
        run: ./mach --no-interactive bootstrap --application-choice="GeckoView/Firefox for Android Artifact Mode"

      - name: Build GeckoView (artifact mode)
        run: ./mach build

      # Gradle 的 debug 簽名預設用 ~/.android/debug.keystore，runner 每次都是新的，會隨機產生一把；
      # 改用 repo 裡固定的公開 debug 金鑰，每一版簽名都一樣，才能覆蓋更新（Obtainium 等）
      - name: Use fixed debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp "$GITHUB_WORKSPACE/../ci-keys/fenix-debug.keystore" "$HOME/.android/debug.keystore"
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"

      - name: Build Fenix APK
        run: ./mach gradle fenix:assembleDebug

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d ~/.mozbuild/android-sdk-linux/build-tools/*/apksigner | sort -V | tail -1)
          for apk in $(find objdir-frontend/gradle/build -name '*.apk' -path '*outputs/apk*'); do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -i "SHA-256"
          done

      - name: List APKs
        run: find objdir-frontend/gradle/build -name '*.apk' -path '*outputs/apk*' -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fenix-debug-${{ inputs.target }}
          path: objdir-frontend/gradle/build/mobile/android/fenix/app/outputs/apk/**/*.apk
          if-no-files-found: error
