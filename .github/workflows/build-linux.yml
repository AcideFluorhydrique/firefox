name: Build Firefox Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MOZCONFIG: ${{ github.workspace }}/../mozconfig-ci

    steps:
      # 免費 runner 只有約 14GB 可用空間，先清掉用不到的預裝工具
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      # 完整編譯不需要歷史
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache ~/.mozbuild (toolchains)
        uses: actions/cache@v4
        with:
          path: ~/.mozbuild
          key: mozbuild-linux-${{ runner.arch }}-${{ hashFiles('python/mozboot/**') }}
          restore-keys: |
            mozbuild-linux-${{ runner.arch }}-

      - name: Write mozconfig
        run: |
          cat > "$MOZCONFIG" <<'EOF'
          ac_add_options --enable-project=browser
          # 不產生除錯符號：大幅減少硬碟用量和連結時的記憶體
          ac_add_options --disable-debug-symbols
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/objdir-opt
          EOF
          cat "$MOZCONFIG"

      - name: Bootstrap
        run: ./mach --no-interactive bootstrap --application-choice="Firefox for Desktop"

      - name: Build
        run: ./mach build

      - name: Package
        run: ./mach package

      - name: List packages
        run: ls -lh objdir-opt/dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: firefox-linux-${{ runner.arch }}
          path: objdir-opt/dist/firefox-*.tar.*
          if-no-files-found: error
